name: CI

on:
  workflow_run:
    workflows: ['Check-in']
    types: [completed]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (action)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.5.0'

      - name: "Fallback: Install Bun if missing"
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            echo "Bun not found — installing via bun.sh installer"
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
          fi
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Run test suite
        run: bun test

      - name: Run sample (smoke)
        run: bun run start
