name: CD

on:
  release:
    types: [published]
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        run: npx jsr publish